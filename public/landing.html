<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AguiaON</title>
  <meta id="meta-description" name="description" content="Plataforma AguiaON">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6366f1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --accent: #6366f1; }
    body { background: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .card { background: #1e293b; border: 1px solid #334155; }
    .btn-primary { background: var(--accent); color: #fff; font-weight: 700; transition: filter .15s; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-outline { border: 1px solid #334155; color: #cbd5e1; transition: all .15s; }
    .btn-outline:hover { border-color: var(--accent); color: #fff; }
    .hero-gradient { background: radial-gradient(ellipse at top, color-mix(in srgb, var(--accent) 25%, transparent) 0%, #0f172a 60%); }
    .step-num { width: 36px; height: 36px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); font-weight: 800; }
    .plano-card.destaque { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .faq-item[open] summary i { transform: rotate(180deg); }
    .input { background: #0f172a; border: 1px solid #334155; border-radius: .5rem; padding: .6rem .9rem; font-size: .875rem; color: #fff; width: 100%; }
    .input:focus { outline: none; border-color: var(--accent); }
    .modal-overlay { background: rgba(2,6,23,.85); backdrop-filter: blur(6px); }
  </style>
</head>
<body class="min-h-screen">

  <div id="loading" class="min-h-screen flex items-center justify-center">
    <i class="fa fa-spinner fa-spin text-3xl text-slate-500"></i>
  </div>

  <div id="not-found" class="hidden min-h-screen flex flex-col items-center justify-center gap-4 text-center p-6">
    <p class="text-slate-400">Essa página ainda não está disponível.</p>
    <a href="/marketplace" class="btn-primary px-5 py-2.5 rounded-lg text-sm">Ver lojas na plataforma</a>
  </div>

  <div id="content" class="hidden">
    <header class="fixed top-0 inset-x-0 z-40 h-14 flex items-center px-4 md:px-8"
            style="background:rgba(15,23,42,.9);backdrop-filter:blur(8px);border-bottom:1px solid #1e293b">
      <div class="font-black text-white text-lg tracking-tighter">AG<span style="color:var(--accent)">ON</span></div>
    </header>

    <main id="blocks-root" class="pt-14"></main>

    <footer class="text-center text-slate-600 text-xs py-8 border-t border-slate-800">
      Uma plataforma AguiaON — <a href="/marketplace" class="underline">ver todas as lojas</a>
    </footer>
  </div>

  <!-- MODAL — Contratar (captura de lead) -->
  <div id="modal-lead" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
    <div class="card rounded-2xl w-full max-w-md max-h-[85vh] overflow-y-auto p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-white font-black text-lg">Contratar</h3>
        <button onclick="closeModal('modal-lead')" class="text-slate-500 hover:text-white"><i class="fa fa-times"></i></button>
      </div>
      <div id="lead-plano-info" class="hidden mb-4 text-xs px-3 py-2 rounded-lg border border-slate-700 bg-slate-900/40 text-slate-300"></div>
      <div class="space-y-3">
        <input id="lead-nome" class="input" placeholder="Seu nome completo *" />
        <input id="lead-empresa" class="input" placeholder="Empresa (opcional)" />
        <input id="lead-whatsapp" class="input" placeholder="WhatsApp" />
        <input id="lead-email" class="input" placeholder="E-mail" />
        <input id="lead-cpf" class="input" placeholder="CPF/CNPJ" />
        <button onclick="enviarLead()" class="btn-primary w-full py-3 rounded-xl text-sm mt-2">Continuar</button>
        <p id="lead-error" class="hidden text-red-400 text-xs text-center"></p>
      </div>
    </div>
  </div>

  <!-- MODAL — Contrato / aceite eletrônico -->
  <div id="modal-contrato" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
    <div class="card rounded-2xl w-full max-w-lg max-h-[85vh] overflow-y-auto p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-white font-black text-lg">Contrato</h3>
        <button onclick="closeModal('modal-contrato')" class="text-slate-500 hover:text-white"><i class="fa fa-times"></i></button>
      </div>
      <div id="contrato-texto" class="text-xs text-slate-400 whitespace-pre-wrap border border-slate-700 rounded-lg p-4 mb-4 max-h-64 overflow-y-auto"></div>
      <div class="space-y-3">
        <input id="aceite-nome" class="input" placeholder="Digite seu nome completo pra confirmar *" />
        <input id="aceite-cpf" class="input" placeholder="Digite seu CPF pra confirmar *" />
        <label class="flex items-start gap-2 text-xs text-slate-400">
          <input type="checkbox" id="aceite-check" class="mt-0.5 accent-[var(--accent)]" />
          Li e concordo com os termos do contrato acima.
        </label>
        <button onclick="confirmarAceite()" class="btn-primary w-full py-3 rounded-xl text-sm">Confirmar aceite</button>
        <p id="aceite-error" class="hidden text-red-400 text-xs text-center"></p>
      </div>
    </div>
  </div>

  <!-- MODAL — Sucesso -->
  <div id="modal-sucesso" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
    <div class="card rounded-2xl w-full max-w-sm p-8 text-center">
      <i class="fa fa-circle-check text-4xl mb-4" style="color:#22c55e"></i>
      <p class="text-white font-bold mb-1">Contrato aceito!</p>
      <p class="text-slate-400 text-sm mb-5">Recebemos seus dados — nossa equipe entra em contato em breve.</p>
      <button onclick="closeModal('modal-sucesso')" class="btn-primary w-full py-3 rounded-xl text-sm">Fechar</button>
    </div>
  </div>

<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

let landing = null;
let deferredPrompt = null;
let leadPlanoAtual = null;
let leadIdAtual = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});

// ─── CTA (usado pelo hero, bloco cta avulso, e cada plano) ────────────────
async function handleCta(cta, plano) {
  if (!cta) return;
  const type = cta.cta_type || 'whatsapp';

  if (type === 'contratar') {
    leadPlanoAtual = plano || null;
    document.getElementById('lead-error').classList.add('hidden');
    ['lead-nome','lead-empresa','lead-whatsapp','lead-email','lead-cpf'].forEach(id => document.getElementById(id).value = '');
    const info = document.getElementById('lead-plano-info');
    if (plano) {
      info.textContent = `Plano selecionado: ${plano.nome}${plano.preco ? ` — R$ ${Number(plano.preco).toFixed(2)}${plano.periodo || ''}` : ''}`;
      info.classList.remove('hidden');
    } else {
      info.classList.add('hidden');
    }
    openModal('modal-lead');
    return;
  }

  if (type === 'whatsapp' && cta.cta_whatsapp) {
    const phone = String(cta.cta_whatsapp).replace(/\D/g, '');
    const text = encodeURIComponent(`Olá! Vim pela página de ${landing?.vertical_label || 'AguiaON'} e quero saber mais.`);
    window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
    return;
  }

  if (type === 'pwa_install') {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    } else {
      window.location.href = '/marketplace' + (landing?.vertical_slug ? `?vertical_slug=${encodeURIComponent(landing.vertical_slug)}` : '');
    }
    return;
  }

  if (type === 'custom_url' && cta.cta_url) {
    window.open(cta.cta_url, '_blank');
    return;
  }

  window.location.href = '/marketplace' + (landing?.vertical_slug ? `?vertical_slug=${encodeURIComponent(landing.vertical_slug)}` : '');
}

async function enviarLead() {
  const nome = document.getElementById('lead-nome').value.trim();
  const err = document.getElementById('lead-error');
  if (!nome) { err.textContent = 'Informe seu nome.'; err.classList.remove('hidden'); return; }

  try {
    const res = await fetch(`/public/landing/${encodeURIComponent(landing.vertical_slug)}/leads`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nome,
        empresa: document.getElementById('lead-empresa').value.trim(),
        whatsapp: document.getElementById('lead-whatsapp').value.trim(),
        email: document.getElementById('lead-email').value.trim(),
        cpf_cnpj: document.getElementById('lead-cpf').value.trim(),
        plano_nome: leadPlanoAtual?.nome || null,
        plano_preco: leadPlanoAtual?.preco || null,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Não foi possível enviar.');

    leadIdAtual = data.id;
    document.getElementById('contrato-texto').textContent = data.contrato_texto || 'Nenhum contrato configurado pra esse módulo ainda — nossa equipe entra em contato pra alinhar os termos.';
    document.getElementById('aceite-nome').value = '';
    document.getElementById('aceite-cpf').value = '';
    document.getElementById('aceite-check').checked = false;
    document.getElementById('aceite-error').classList.add('hidden');
    closeModal('modal-lead');
    openModal('modal-contrato');
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  }
}

async function confirmarAceite() {
  const nome = document.getElementById('aceite-nome').value.trim();
  const cpf = document.getElementById('aceite-cpf').value.trim();
  const checked = document.getElementById('aceite-check').checked;
  const err = document.getElementById('aceite-error');

  if (!nome || !cpf || !checked) {
    err.textContent = 'Preencha nome, CPF e confirme que leu o contrato.';
    err.classList.remove('hidden');
    return;
  }

  try {
    const res = await fetch(`/public/landing/leads/${leadIdAtual}/aceitar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aceite_nome: nome, aceite_cpf: cpf }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Não foi possível confirmar.');
    closeModal('modal-contrato');
    openModal('modal-sucesso');
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  }
}

// ─── Renderização dos blocos ───────────────────────────────────────────────
function renderHeroMedia(b) {
  if (b.hero_video_url) {
    const url = b.hero_video_url;
    const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]+)/);
    if (yt) return `<iframe class="w-full aspect-video" src="https://www.youtube.com/embed/${esc(yt[1])}" frameborder="0" allowfullscreen></iframe>`;
    return `<video class="w-full" src="${esc(url)}" controls playsinline></video>`;
  }
  if (b.hero_image_url) return `<img src="${esc(b.hero_image_url)}" class="w-full" alt="">`;
  return '';
}

function blockHero(b, i) {
  const media = renderHeroMedia(b);
  return `
  <section class="hero-gradient pt-16 pb-16 px-5 md:px-8">
    <div class="max-w-3xl mx-auto text-center">
      <h1 class="text-3xl md:text-5xl font-black text-white leading-tight">${esc(b.headline)}</h1>
      ${b.subheadline ? `<p class="text-slate-400 text-base md:text-lg mt-4 max-w-xl mx-auto">${esc(b.subheadline)}</p>` : ''}
      ${media ? `<div class="mt-8 rounded-2xl overflow-hidden border border-slate-700 max-w-xl mx-auto">${media}</div>` : ''}
      ${b.cta_label ? `<div class="mt-8">
        <button onclick='handleCta(${JSON.stringify(b).replace(/'/g,"&#39;")})' class="btn-primary px-7 py-3.5 rounded-xl text-base inline-flex items-center gap-2">
          <span>${esc(b.cta_label)}</span><i class="fa fa-arrow-right"></i>
        </button>
      </div>` : ''}
    </div>
  </section>`;
}

function blockBenefits(b) {
  const items = b.items || [];
  if (!items.length) return '';
  return `
  <section class="px-5 md:px-8 py-14">
    <div class="max-w-4xl mx-auto">
      ${b.title ? `<h2 class="text-xl font-black text-white text-center mb-8">${esc(b.title)}</h2>` : ''}
      <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-4">
        ${items.map(it => `
          <div class="card rounded-xl p-5">
            <div class="text-2xl mb-2">${esc(it.icon || '✅')}</div>
            <p class="text-white font-bold text-sm mb-1">${esc(it.title || '')}</p>
            <p class="text-slate-400 text-sm">${esc(it.text || '')}</p>
          </div>`).join('')}
      </div>
    </div>
  </section>`;
}

function blockRecursos(b) {
  const items = b.items || [];
  if (!items.length) return '';
  return `
  <section class="px-5 md:px-8 py-14" style="background:#0b1220">
    <div class="max-w-3xl mx-auto">
      ${b.title ? `<h2 class="text-xl font-black text-white text-center mb-8">${esc(b.title)}</h2>` : ''}
      <div class="grid sm:grid-cols-2 gap-3">
        ${items.map(it => `
          <div class="flex items-start gap-3 card rounded-xl p-4">
            <span class="text-lg shrink-0">${esc(it.icon || '⚙️')}</span>
            <div>
              <p class="text-white font-bold text-sm">${esc(it.title || '')}</p>
              <p class="text-slate-400 text-xs mt-0.5">${esc(it.text || '')}</p>
            </div>
          </div>`).join('')}
      </div>
    </div>
  </section>`;
}

function blockSteps(b) {
  const items = b.items || [];
  if (!items.length) return '';
  return `
  <section class="px-5 md:px-8 py-14">
    <div class="max-w-2xl mx-auto">
      <h2 class="text-xl font-black text-white text-center mb-8">${esc(b.title || 'Como funciona')}</h2>
      <div class="space-y-5">
        ${items.map((s, i) => `
          <div class="flex items-start gap-4">
            <div class="step-num flex items-center justify-center shrink-0">${i + 1}</div>
            <div>
              <p class="text-white font-bold text-sm">${esc(s.title || '')}</p>
              <p class="text-slate-400 text-sm mt-0.5">${esc(s.text || '')}</p>
            </div>
          </div>`).join('')}
      </div>
    </div>
  </section>`;
}

function blockPlanos(b) {
  const items = b.items || [];
  if (!items.length) return '';
  return `
  <section class="px-5 md:px-8 py-14" style="background:#0b1220">
    <div class="max-w-5xl mx-auto">
      <h2 class="text-xl font-black text-white text-center mb-8">${esc(b.title || 'Planos')}</h2>
      <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-5">
        ${items.map(p => `
          <div class="plano-card card rounded-2xl p-6 flex flex-col ${p.destaque ? 'destaque' : ''}">
            ${p.destaque ? `<span class="text-[10px] font-black uppercase tracking-widest px-2 py-0.5 rounded-full self-start mb-2" style="background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)">Mais popular</span>` : ''}
            <p class="text-white font-black text-lg">${esc(p.nome || '')}</p>
            <p class="text-slate-400 text-xs mt-1 mb-4">${esc(p.descricao || '')}</p>
            <p class="text-3xl font-black text-white">R$ ${Number(p.preco || 0).toFixed(2)}<span class="text-sm text-slate-500 font-normal">${esc(p.periodo || '/mês')}</span></p>
            <ul class="text-slate-300 text-sm space-y-2 my-5 flex-1">
              ${(p.recursos || []).map(r => `<li class="flex items-center gap-2"><i class="fa fa-check text-xs" style="color:var(--accent)"></i>${esc(r)}</li>`).join('')}
            </ul>
            <button onclick='handleCta({cta_type:"contratar"}, ${JSON.stringify({ nome: p.nome, preco: p.preco, periodo: p.periodo }).replace(/'/g,"&#39;")})'
                    class="btn-primary w-full py-3 rounded-xl text-sm">${esc(p.cta_label || 'Contratar')}</button>
          </div>`).join('')}
      </div>
    </div>
  </section>`;
}

function blockDepoimentos(b) {
  const items = b.items || [];
  if (!items.length) return '';
  return `
  <section class="px-5 md:px-8 py-14">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-xl font-black text-white text-center mb-8">${esc(b.title || 'O que dizem')}</h2>
      <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-4">
        ${items.map(d => `
          <div class="card rounded-xl p-5">
            <p class="text-slate-300 text-sm italic mb-4">"${esc(d.texto || '')}"</p>
            <div class="flex items-center gap-3">
              ${d.foto_url ? `<img src="${esc(d.foto_url)}" class="w-9 h-9 rounded-full object-cover">` : `<div class="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-400">${esc((d.nome||'?')[0])}</div>`}
              <div>
                <p class="text-white font-bold text-xs">${esc(d.nome || '')}</p>
                <p class="text-slate-500 text-[11px]">${esc(d.cargo || '')}</p>
              </div>
            </div>
          </div>`).join('')}
      </div>
    </div>
  </section>`;
}

function blockFaq(b) {
  const items = b.items || [];
  if (!items.length) return '';
  return `
  <section class="px-5 md:px-8 py-14" style="background:#0b1220">
    <div class="max-w-2xl mx-auto">
      <h2 class="text-xl font-black text-white text-center mb-8">${esc(b.title || 'Perguntas frequentes')}</h2>
      <div class="space-y-2">
        ${items.map(f => `
          <details class="faq-item card rounded-xl px-4 py-3">
            <summary class="cursor-pointer flex items-center justify-between text-white font-bold text-sm">
              ${esc(f.pergunta || '')}<i class="fa fa-chevron-down text-xs text-slate-500 transition-transform"></i>
            </summary>
            <p class="text-slate-400 text-sm mt-2">${esc(f.resposta || '')}</p>
          </details>`).join('')}
      </div>
    </div>
  </section>`;
}

function blockCta(b) {
  return `
  <section class="px-5 md:px-8 py-16 text-center">
    ${b.headline ? `<h2 class="text-xl md:text-2xl font-black text-white mb-5">${esc(b.headline)}</h2>` : ''}
    <button onclick='handleCta(${JSON.stringify(b).replace(/'/g,"&#39;")})' class="btn-primary px-7 py-3.5 rounded-xl text-base inline-flex items-center gap-2">
      <span>${esc(b.cta_label || 'Saiba mais')}</span><i class="fa fa-arrow-right"></i>
    </button>
  </section>`;
}

const BLOCK_RENDERERS = {
  hero: blockHero, benefits: blockBenefits, recursos: blockRecursos, steps: blockSteps,
  planos: blockPlanos, depoimentos: blockDepoimentos, faq: blockFaq, cta: blockCta,
};

function renderBlocks(blocks) {
  document.getElementById('blocks-root').innerHTML = (blocks || [])
    .map((b, i) => (BLOCK_RENDERERS[b.type] ? BLOCK_RENDERERS[b.type](b, i) : ''))
    .join('');
}

async function init() {
  try {
    const previewSlug = new URLSearchParams(window.location.search).get('preview_slug');
    let res;
    if (previewSlug) {
      const token = localStorage.getItem('admin_token') || localStorage.getItem('ag_token') || '';
      res = await fetch(`/public/landing/preview/${encodeURIComponent(previewSlug)}`, {
        headers: { Authorization: 'Bearer ' + token },
      });
    } else {
      res = await fetch('/public/landing/resolve?path=' + encodeURIComponent(window.location.pathname));
    }
    if (!res.ok) throw new Error('not found');
    landing = await res.json();

    const heroBlock = (landing.blocks || []).find(b => b.type === 'hero');
    document.title = landing.seo_title || heroBlock?.headline || 'AguiaON';
    document.getElementById('meta-description').setAttribute('content', landing.seo_description || heroBlock?.subheadline || '');

    renderBlocks(landing.blocks);

    if (previewSlug) {
      const banner = document.createElement('div');
      banner.className = 'fixed top-14 inset-x-0 z-30 text-center text-xs font-bold py-1.5';
      banner.style.cssText = 'background:#eab308;color:#1e293b';
      banner.textContent = landing.published ? 'Pré-visualização (já publicada)' : 'Pré-visualização — rascunho, ainda não publicado';
      document.body.appendChild(banner);
    }

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  } catch (e) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('not-found').classList.remove('hidden');
  }
}
init();

if (!new URLSearchParams(window.location.search).get('preview_slug') && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
