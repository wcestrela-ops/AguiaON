<!DOCTYPE html>
<html>
<head><title>Gerador de Ícones AG-ON</title></head>
<body style="background:#020617;color:white;font-family:sans-serif;padding:40px;text-align:center">
<h2>Clique nos botões para baixar os ícones PNG</h2>
<p style="color:#64748b">Salve os arquivos na pasta <code>public/icons/</code></p>
<br>
<button onclick="generateIcon(192)" style="background:#6366f1;color:white;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;margin:8px;font-size:14px">⬇ Baixar icon-192.png</button>
<button onclick="generateIcon(512)" style="background:#6366f1;color:white;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;margin:8px;font-size:14px">⬇ Baixar icon-512.png</button>

<div id="preview" style="margin-top:40px"></div>

<script>
function generateIcon(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const r = size * 0.187; // border-radius proporcional

    // Fundo arredondado
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();

    // Gradiente de fundo
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#1e1b4b');
    grad.addColorStop(1, '#020617');
    ctx.fillStyle = grad;
    ctx.fill();

    // Texto "AG"
    const fontSize = Math.round(size * 0.367);
    ctx.font = `900 ${fontSize}px "Arial Black", Arial, sans-serif`;
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'alphabetic';
    ctx.letterSpacing = `-${size * 0.016}px`;
    ctx.fillText('AG', size * 0.12, size * 0.6);

    // Texto "ON" em índigo
    ctx.fillStyle = '#6366f1';
    ctx.fillText('ON', size * 0.51, size * 0.6);

    // Ponto de acento
    ctx.beginPath();
    ctx.arc(size * 0.89, size * 0.625, size * 0.043, 0, Math.PI * 2);
    ctx.fillStyle = '#6366f1';
    ctx.fill();

    // Download
    const link = document.createElement('a');
    link.download = `icon-${size}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();

    // Preview
    canvas.style.borderRadius = '12px';
    canvas.style.margin = '10px';
    canvas.style.maxWidth = '200px';
    document.getElementById('preview').appendChild(canvas);
}
</script>
</body>
</html>
